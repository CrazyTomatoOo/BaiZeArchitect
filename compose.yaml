services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.binary
    environment:
      BAIZE_DB_PATH: /tmp/baize/baize.sqlite3
      MCP_CONFIG_PATH: /app/mcp.config.json
      HOME: /tmp
      PI_CODING_AGENT_DIR: /tmp/baize-agent
    command: ["Add dashboard sharing"]

  test:
    build: .
    profiles:
      - test
    environment:
      BAIZE_DB_PATH: /tmp/baize/baize.sqlite3
      MCP_CONFIG_PATH: /app/mcp.config.json
      HOME: /tmp
      PI_CODING_AGENT_DIR: /app/.pi-agent
    command:
      [
        "npm",
        "test"
      ]
