# BaiZe Architect — 单进程本地 agent。
# ponytail: out 挂 ./out 可 git commit(archive.sh);evidence 挂 /evidence:ro
# (#5: evidence.sh 宿主 codebase-memory-mcp 预产结构化证据,cli.ts 注入)。
# evolver-home 挂 /evolver-home (#9b: evolver-mcp 本地 gene store 持久)。
# 目标仓库由 run.sh -v <repo>:/repo:ro 挂入(lws/test-repo-2);
# build 前删 ._ 防 AppleDouble。
services:
  baize:
    build:
      context: .
      dockerfile: agent-runtime/Dockerfile
    volumes:
      - ./evidence:/evidence:ro
      - ./out:/app/out
      - ./evolver-home:/evolver-home
    environment:
      - BAIZE_PROJECT_ROOT=/app
      - BAIZE_OUT_DIR=/app/out
      - BAIZE_EVIDENCE_DIR=/evidence
      - BAIZE_EVOLVER=1
      - EVOLVER_HOME=/evolver-home
      - RUNTIME_MODEL_PROVIDER=${PI_PROVIDER:-bailian}
      - RUNTIME_MODEL_ID=${PI_MODEL:-glm-5.2}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - BAIZE_AUTO_APPROVE=${BAIZE_AUTO_APPROVE:-1}
      - EVOLVER_IPC_TOKEN=${EVOLVER_IPC_TOKEN:-}
      - EVOLVER_PROXY_URL=${EVOLVER_PROXY_URL:-}
