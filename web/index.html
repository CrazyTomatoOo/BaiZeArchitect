<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BaiZe Architect</title>
    <style>
      /* BaiZe design tokens — 双主题(暗色 Graphite Indigo 收紧 + 亮色)。OKLCH;单一真源见 DESIGN.md。 */
      /* — 暗色默认(收紧后:surface -1.5%L,border 提亮至 48%) — */
      :root {
        /* 基面:石墨 + 可见边框 */
        --bg: oklch(17.0% 0.009 264.3);
        --surface: oklch(21.5% 0.012 264.3);
        --surface-2: oklch(24.5% 0.014 267);
        --surface-hover: oklch(28.5% 0.016 264.3);
        --border: oklch(48.0% 0.026 265.5);
        --border-strong: oklch(52.0% 0.023 260.1);
        /* 文字(对 bg 对比 14.2 / 5.8 / 5.1 :1,WCAG AA) */
        --text: oklch(89.1% 0.008 260.7);
        --text-muted: oklch(63.9% 0.016 264.5);
        --text-subtle: oklch(60.6% 0.016 264.4);
        /* accent + 状态(run 专色与 ok 显式区分) */
        --accent: oklch(68.1% 0.169 275);
        --accent-hi: oklch(74% 0.165 275);
        --accent-fg: oklch(17.0% 0.009 264.3);
        --run: oklch(75.4% 0.139 232.7);
        --ok: oklch(77.3% 0.153 163.2);
        --warn: oklch(83.7% 0.164 84.4);
        --danger: oklch(71.9% 0.169 13.4);
        --scrim: oklch(12% 0.01 264 / 0.55);
        --accent-glow: oklch(68.1% 0.169 275 / 0.15);
        --accent-line: oklch(68.1% 0.169 275 / 0.55);
        --nav-card: oklch(20% 0.01 264 / 0.72);
        --ok-soft: oklch(77.3% 0.153 163.2 / 0.15);
        --warn-soft: oklch(83.7% 0.164 84.4 / 0.12);
        --warn-line: oklch(83.7% 0.164 84.4 / 0.3);
        --scrim-strong: oklch(8% 0.01 264 / 0.6);
        --shadow-1: oklch(10% 0.01 264 / 0.3);
        --shadow-2: oklch(10% 0.01 264 / 0.5);
        /* 几何(收紧:radius 4/3px) */
        --radius: 4px;
        --radius-sm: 3px;
        --radius-card: 4px;
        --radius-input: 4px;
        --radius-pill: 999px;
        /* 间距(收紧:pad 12 / gap 8) */
        --pad: 12px;
        --gap: 8px;
        --gap-dense: 4px;
        --space-2xs: 0.5rem;
        --space-xs: 0.75rem;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        /* 布局尺寸(双主题共享——尺寸不随主题变) */
        --topbar-h: 40px;
        --activity-bar-w: 48px;
        --side-bar-w: 240px;
        --side-bar-w-min: 160px;
        --side-bar-w-max: 480px;
        --rail-w: 320px;
        --panel-h-open: 240px;
        --status-bar-h: 24px;
        --icon-size: 20px;
        --accent-border-w: 3px;
        --status-dot-size: 8px;
        /* 字体:display 自托管(latin),CJK 诚实回退系统栈 */
        --font-ui: -apple-system, "SF Pro Text", system-ui, sans-serif;
        --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", monospace;
        --font-display: "Space Grotesk Variable", -apple-system, system-ui, sans-serif;
        /* type scale(收紧:base 13px) */
        --text-xs: 0.625rem;
        --text-sm: 0.75rem;
        --text-base: 0.8125rem;
        --text-lg: 1rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-display: 1.9rem;
        /* easing(命名,禁用默认 ease) */
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        --dur-1: 150ms;
        --dur-2: 250ms;
        /* focus ring */
        --focus-ring: 2px solid var(--accent);
      }

      /* — 系统跟随亮色(prefers-color-scheme: light 且未手动选暗色) — */
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          /* 基面:近白微冷 + 可见边框(共享 Indigo 色相 H=275) */
          --bg: oklch(98.5% 0.003 264.0);
          --surface: oklch(96.5% 0.004 264.0);
          --surface-2: oklch(94.5% 0.005 264.0);
          --surface-hover: oklch(92.5% 0.006 264.0);
          --border: oklch(65.0% 0.012 265.0);
          --border-strong: oklch(50.0% 0.015 260.0);
          /* 文字(对 bg 对比 19.4 / 8.2 / 7.5 :1,WCAG AA) */
          --text: oklch(15.0% 0.008 260.0);
          --text-muted: oklch(42.0% 0.014 264.0);
          --text-subtle: oklch(44.0% 0.014 264.0);
          /* accent + 状态(同色相降明度) */
          --accent: oklch(45.0% 0.169 275.0);
          --accent-hi: oklch(40.0% 0.169 275.0);
          --accent-fg: oklch(98.5% 0.003 264.0);
          --run: oklch(45.0% 0.139 232.7);
          --ok: oklch(45.0% 0.153 163.2);
          --warn: oklch(60.0% 0.164 84.4);
          --danger: oklch(48.0% 0.169 13.4);
          --scrim: oklch(0% 0 0 / 0.45);
          --accent-glow: oklch(45.0% 0.169 275.0 / 0.08);
          --accent-line: oklch(45.0% 0.169 275.0 / 0.40);
          --nav-card: oklch(96% 0.004 264 / 0.72);
          --ok-soft: oklch(45.0% 0.153 163.2 / 0.12);
          --warn-soft: oklch(60.0% 0.164 84.4 / 0.10);
          --warn-line: oklch(60.0% 0.164 84.4 / 0.30);
          --scrim-strong: oklch(0% 0 0 / 0.50);
          --shadow-1: oklch(0% 0 0 / 0.08);
          --shadow-2: oklch(0% 0 0 / 0.12);
        }
      }

      /* — 手动亮色覆写 — */
      :root[data-theme="light"] {
        --bg: oklch(98.5% 0.003 264.0);
        --surface: oklch(96.5% 0.004 264.0);
        --surface-2: oklch(94.5% 0.005 264.0);
        --surface-hover: oklch(92.5% 0.006 264.0);
        --border: oklch(65.0% 0.012 265.0);
        --border-strong: oklch(50.0% 0.015 260.0);
        --text: oklch(15.0% 0.008 260.0);
        --text-muted: oklch(42.0% 0.014 264.0);
        --text-subtle: oklch(44.0% 0.014 264.0);
        --accent: oklch(45.0% 0.169 275.0);
        --accent-hi: oklch(40.0% 0.169 275.0);
        --accent-fg: oklch(98.5% 0.003 264.0);
        --run: oklch(45.0% 0.139 232.7);
        --ok: oklch(45.0% 0.153 163.2);
        --warn: oklch(60.0% 0.164 84.4);
        --danger: oklch(48.0% 0.169 13.4);
        --scrim: oklch(0% 0 0 / 0.45);
        --accent-glow: oklch(45.0% 0.169 275.0 / 0.08);
        --accent-line: oklch(45.0% 0.169 275.0 / 0.40);
        --nav-card: oklch(96% 0.004 264 / 0.72);
        --ok-soft: oklch(45.0% 0.153 163.2 / 0.12);
        --warn-soft: oklch(60.0% 0.164 84.4 / 0.10);
        --warn-line: oklch(60.0% 0.164 84.4 / 0.30);
        --scrim-strong: oklch(0% 0 0 / 0.50);
        --shadow-1: oklch(0% 0 0 / 0.08);
        --shadow-2: oklch(0% 0 0 / 0.12);
      }

      /* — 手动暗色覆写(覆盖系统 prefers-color-scheme: light) — */
      :root[data-theme="dark"] {
        --bg: oklch(17.0% 0.009 264.3);
        --surface: oklch(21.5% 0.012 264.3);
        --surface-2: oklch(24.5% 0.014 267);
        --surface-hover: oklch(28.5% 0.016 264.3);
        --border: oklch(48.0% 0.026 265.5);
        --border-strong: oklch(52.0% 0.023 260.1);
        --text: oklch(89.1% 0.008 260.7);
        --text-muted: oklch(63.9% 0.016 264.5);
        --text-subtle: oklch(60.6% 0.016 264.4);
        --accent: oklch(68.1% 0.169 275);
        --accent-hi: oklch(74% 0.165 275);
        --accent-fg: oklch(17.0% 0.009 264.3);
        --run: oklch(75.4% 0.139 232.7);
        --ok: oklch(77.3% 0.153 163.2);
        --warn: oklch(83.7% 0.164 84.4);
        --danger: oklch(71.9% 0.169 13.4);
        --scrim: oklch(12% 0.01 264 / 0.55);
        --accent-glow: oklch(68.1% 0.169 275 / 0.15);
        --accent-line: oklch(68.1% 0.169 275 / 0.55);
        --nav-card: oklch(20% 0.01 264 / 0.72);
        --ok-soft: oklch(77.3% 0.153 163.2 / 0.15);
        --warn-soft: oklch(83.7% 0.164 84.4 / 0.12);
        --warn-line: oklch(83.7% 0.164 84.4 / 0.3);
        --scrim-strong: oklch(8% 0.01 264 / 0.6);
        --shadow-1: oklch(10% 0.01 264 / 0.3);
        --shadow-2: oklch(10% 0.01 264 / 0.5);
      }
      html,
      body {
        margin: 0;
        overflow-x: clip;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
      }
      :focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <baize-shell></baize-shell>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
